name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate the managed fan-out
        # .claude/skills, .codex and .agents are gitignored, so a fresh checkout
        # does not have them. tests/test_skill_inventory.sh reconciles the
        # top-level skill sources against that fan-out and fails with 72
        # file-set mismatches until it exists. This mirrors CONTRIBUTING's
        # "開發與驗證" steps 2-3, where generate runs before the Verify chain.
        run: PROFILE=all bash bootstrap/generate.sh

      - name: Verify repository (canonical runner; discovers every suite)
        # CI is the authoritative gate, so it never reuses a cached payload-check
        # verdict. The cache is a local developer convenience only.
        env:
          SKILL_COMMONS_VERIFY_NO_CACHE: "1"
        run: bash tests/verify.sh

      - name: Lint documentation
        run: bash scripts/lint-docs.sh

  bash-32-compat:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record system Bash
        run: /bin/bash --version

      - name: Verify generate safety with system Bash
        run: PATH=/usr/bin:/bin /bin/bash tests/bootstrap/test_generate_safety.sh

      - name: Verify lifecycle management with system Bash
        run: PATH=/usr/bin:/bin /bin/bash tests/bootstrap/test_manage.sh

      - name: Verify onboarding with system Bash
        run: PATH=/usr/bin:/bin /bin/bash tests/bootstrap/test_onboard.sh
