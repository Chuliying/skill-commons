# Pinned secret-scanning engine — item 1 secret-engine-adapter (FU-001, ADR-R1 條件 2/3).
#
# Trust chain (no self-attestation): preflight downloads the platform binary AND the
# official checksums.txt, verifies checksums.txt against `checksums.sha256` (the anchor
# committed here, computed from the official file), then verifies the downloaded binary
# against its per-platform entry inside that verified checksums.txt.
# Scan time is zero-network (ADR-R1 條件 3); engine absence or any hash mismatch =>
# security gate FAIL + install guidance (fail-closed, never silent pass / downgrade /
# scan-time download). Hash values are populated only from the official release; a
# mistranscribed hash yields a preflight FAIL (fail-closed), never a false-green.
engine: gitleaks
version: v8.30.1            # floor >= v8.21 for [[allowlists]] / targetRules path+rule 綁定 (FU-001)
checksums:
  # Official per-release checksums file; its own SHA-256 is the pin anchor.
